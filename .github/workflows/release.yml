# Publishes Theoistic.PDF to NuGet when a version tag is pushed:
#
#   git tag -a v2.0.0 -m "Theoistic.PDF 2.0.0"
#   git push origin v2.0.0
#
# Publishing uses NuGet Trusted Publishing: no API key is stored anywhere. The job proves its
# identity to nuget.org with a GitHub OIDC token and receives an API key valid for one hour.
# That needs a one-time trusted publishing policy on nuget.org (username > Trusted Publishing):
#
#   Repository Owner:  Theoistic
#   Repository:        Theoistic.PDF
#   Workflow File:     release.yml        <- the file name only, not the path
#   Environment:       (leave empty)
#
# Renaming this file breaks publishing until the policy is updated to match.
# Nothing is published unless the tests pass.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    # Windows, because the end-to-end tests drive Edge, which every Windows runner has. On the
    # Ubuntu runners AppArmor blocks Chrome's sandbox, so those tests would fail for reasons that
    # have nothing to do with the package.
    runs-on: windows-latest

    # Job-level permissions replace the workflow's, so contents: read is restated here.
    # id-token: write is what lets the job request the OIDC token nuget.org exchanges for a key.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # A tag is easy to mistype and a NuGet version can never be reused, so the tag has to agree
      # with the version the package will actually carry.
      - name: Check the tag matches the package version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$project = Get-Content Theoistic.PDF/Theoistic.PDF.csproj
          $version = @($project.Project.PropertyGroup.PackageVersion | Where-Object { $_ })[0]
          if ($tag -ne $version) {
            Write-Error "Tag '$tag' does not match PackageVersion '$version' in Theoistic.PDF.csproj."
            exit 1
          }
          Write-Host "Releasing $version"

      - name: Test
        run: dotnet test Theoistic.PDF.Tests/Theoistic.PDF.Tests.csproj --configuration Release

      - name: Pack
        run: dotnet pack Theoistic.PDF/Theoistic.PDF.csproj --configuration Release --output artifacts

      # Kept on the run whether or not publishing succeeds, so a failed push can be retried by
      # hand with exactly the package that passed the tests.
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/*.nupkg

      # Requested immediately before the push: the key it returns expires after an hour.
      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org profile name that owns the package - not an email address. It is
          # public on the package page, so it is not kept as a secret.
          user: Theoistic

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
